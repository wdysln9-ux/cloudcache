name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStableDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudcache-stable-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 7
